name: albania_speaking_companion
description: Speak real, everyday Albanian from day one. 99 practical phrases with pronunciation, audio and quizzes — fully offline, no account needed. Mirë se erdhe!
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.8.1
  shared_preferences: ^2.5.6
  flutter_local_notifications: 17.2.4
  flutter_timezone: ^5.1.1
  timezone: ^0.9.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/audio/
    - assets/images/
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  remove_alpha_ios: true
  background_color_ios: '#ed161d'
  web:
    generate: true
    image_path: assets/images/app_icon.png
    background_color: '#ed161d'
    theme_color: '#ed161d'
